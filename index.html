<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toque Trainer</title>
<style>
  :root{--bg:#14161a;--card:#1d2026;--line:#2c3038;--fg:#e8eaed;--mut:#8b919c;--acc:#f5c542;--dn:#4fc3f7;--up:#ff8a65}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:760px}
  h1{font-size:18px;margin:0 0 16px;font-weight:600;letter-spacing:.3px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .play{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:#111;font-size:18px;cursor:pointer;display:grid;place-items:center}
  .title{font-family:ui-monospace,Consolas,monospace;font-size:18px;flex:1;min-width:180px}
  .title input{background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--fg);font:inherit;width:100%}
  .bpm{font-family:ui-monospace,Consolas,monospace;color:var(--mut);font-size:18px}
  .bpm b{color:var(--fg)}
  .grid{display:flex;margin-top:22px;overflow-x:auto;padding-bottom:6px}
  .beat{flex:1;display:flex;border-left:1px solid var(--line);min-width:0}
  .beat:first-child{border-left:0}
  .slot{flex:1;min-width:34px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;border-radius:8px;padding:6px 0;user-select:none;position:relative}
  .slot:hover{background:#252932}
  .slot.now{background:#2e3340}
  .arrow{font-size:34px;line-height:1;height:44px;display:grid;place-items:center;font-weight:700}
  .arrow.D{color:var(--dn)}.arrow.U{color:var(--up)}.arrow.N{color:transparent}
  .slot.now .arrow.D,.slot.now .arrow.U{transform:scale(1.25);text-shadow:0 0 12px currentColor}
  .lbl{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--mut)}
  .lbl.beatnum{color:var(--fg);font-weight:700}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
  .slot.now .dot{background:var(--acc)}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  label{font-size:13px;color:var(--mut)}
  .speed{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  input[type=range]{flex:1;accent-color:var(--acc);height:28px}
  .big{font-family:ui-monospace,Consolas,monospace;font-size:26px;min-width:90px;text-align:right}
  .btn{background:#2a2e37;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--mut)}
  .btn.on{background:var(--acc);color:#111;border-color:var(--acc)}
  .sep{width:1px;height:24px;background:var(--line)}
  .hint{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.5}
  select{background:#2a2e37;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎸 Toque Trainer</h1>

  <div class="card">
    <div class="head">
      <button class="play" id="play" title="Tocar / Pausar (Espaço)">▶</button>
      <div class="title"><input id="name" value="[Ritmo Padrão - Sugestão]" aria-label="Nome do ritmo"></div>
      <div class="bpm"><b id="bpmShown">89</b> bpm</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="hint">Clique em cada posição para alternar: vazio → ↓ (baixo) → ↑ (cima). O toque se repete a cada compasso.</div>
  </div>

  <div class="card">
    <div class="speed">
      <label for="bpm">Velocidade</label>
      <input type="range" id="bpm" min="30" max="200" value="89">
      <div class="big"><span id="pct">100</span>%</div>
    </div>
    <div class="row" style="margin-bottom:14px">
      <label>Atalhos:</label>
      <button class="btn" data-p="40">40%</button>
      <button class="btn" data-p="50">50%</button>
      <button class="btn" data-p="60">60%</button>
      <button class="btn" data-p="75">75%</button>
      <button class="btn" data-p="90">90%</button>
      <button class="btn" data-p="100">100%</button>
      <div class="sep"></div>
      <button class="btn" id="minus">− 1 bpm</button>
      <button class="btn" id="plus">+ 1 bpm</button>
    </div>
    <div class="row">
      <label>BPM original: <input type="number" id="orig" value="89" min="30" max="240" style="width:64px;background:#2a2e37;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px"></label>
      <div class="sep"></div>
      <label>Divisão:
        <select id="div"><option value="8" selected>colcheias (8)</option><option value="16">semicolcheias (16)</option></select>
      </label>
      <div class="sep"></div>
      <label>Instrumento:
        <select id="inst"><option value="violao" selected>Violão</option><option value="cavaco">Cavaquinho</option></select>
      </label>
      <button class="btn on" id="tgStrum">Som do toque</button>
      <button class="btn on" id="tgClick">Metrônomo</button>
      <button class="btn" id="tgCount">Contagem 1 compasso</button>
    </div>
    <div class="row" style="margin-top:14px">
      <label>Presets:</label>
      <button class="btn" data-preset="pop">Pop (D·DU·UDU)</button>
      <button class="btn" data-preset="bossa">Baião/Sertanejo</button>
      <button class="btn" data-preset="down">Só para baixo</button>
      <button class="btn" data-preset="clear">Limpar</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <button class="btn on" id="saveBtn">💾 Salvar sequência</button>
      <span class="hint" style="margin:0">Salva o nome, o toque, o bpm e o instrumento atuais. Salvar com o mesmo nome substitui.</span>
    </div>
    <div id="saved"></div>
  </div>
</div>

<style>
  .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .item .nm{flex:1;min-width:0}
  .item .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .nm span{font-size:12px;color:var(--mut);font-family:ui-monospace,Consolas,monospace}
  .empty{font-size:13px;color:var(--mut)}
</style>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  let div=8;                       // slots por compasso (4 tempos)
  let pattern=['D','N','D','U','N','U','D','U']; // D=baixo U=cima N=vazio
  const presets={
    pop:{8:['D','N','D','U','N','U','D','U']},
    bossa:{8:['D','N','D','U','D','U','D','U']},
    down:{8:['D','N','D','N','D','N','D','N']},
    clear:{8:Array(8).fill('N')}
  };
  const arrows={D:'↓',U:'↑',N:'·'};
  const state={playing:false,step:0,next:0,timer:null,strum:true,click:true,count:false,counting:false};
  let ctx=null;

  // ---- persistência ----
  try{
    const s=JSON.parse(localStorage.getItem('toque')||'null');
    if(s){div=s.div||8;pattern=s.pattern||pattern;$('bpm').value=s.bpm||89;$('orig').value=s.orig||89;$('name').value=s.name||$('name').value;}
  }catch(e){}
  function save(){try{localStorage.setItem('toque',JSON.stringify({div,pattern,bpm:+$('bpm').value,orig:+$('orig').value,name:$('name').value}))}catch(e){}}

  // ---- UI ----
  function slotLabel(i){
    const per=div/4, p=i%per;
    if(p===0) return {t:String(i/per+1),b:true};
    if(div===8) return {t:'e',b:false};
    return {t:['','e','&','a'][p],b:false};
  }
  function render(){
    const g=$('grid');g.innerHTML='';
    const per=div/4;
    for(let b=0;b<4;b++){
      const beat=document.createElement('div');beat.className='beat';
      for(let k=0;k<per;k++){
        const i=b*per+k,l=slotLabel(i);
        const s=document.createElement('div');s.className='slot';s.dataset.i=i;
        const v=pattern[i]||'N';
        s.innerHTML=`<div class="arrow ${v}">${arrows[v]==='·'?'↓':arrows[v]}</div><div class="lbl ${l.b?'beatnum':''}">${l.t}</div><div class="dot"></div>`;
        s.onclick=()=>{pattern[i]={N:'D',D:'U',U:'N'}[pattern[i]||'N'];render();save();previewHit(pattern[i]);};
        beat.appendChild(s);
      }
      g.appendChild(beat);
    }
  }
  function highlight(i){
    document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('now',+s.dataset.i===i));
  }

  // ---- áudio ----
  function ensureCtx(){
    if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
  }
  function clickSound(t,accent){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=accent?1500:1000;o.type='square';
    g.gain.setValueAtTime(accent?.18:.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);
    o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.05);
  }
  // acorde de violão sintetizado (cordas pinçadas em sequência)
  const instruments={
    violao:{strings:[82.4,110,146.8,196,246.9,329.6],spread:.012,decay:.5,len:.6,k:.4975,vol:.5},   // E A D G B E
    cavaco:{strings:[293.66,392,493.88,587.33],spread:.007,decay:.32,len:.4,k:.499,vol:.7}          // D G B D
  };
  let inst='violao';
  function strumSound(t,dir){
    const I=instruments[inst],n=I.strings.length;
    const order=I.strings.map((_,i)=>i);
    if(dir==='U')order.reverse();
    order.forEach((si,idx)=>{
      const f=I.strings[si];
      const when=t+idx*I.spread;
      const buf=ctx.createBuffer(1,ctx.sampleRate*I.len,ctx.sampleRate);
      const d=buf.getChannelData(0);
      const N=Math.round(ctx.sampleRate/f);
      for(let i=0;i<N;i++)d[i]=Math.random()*2-1;
      for(let i=N;i<d.length;i++)d[i]=(d[i-N]+d[i-N+1])*I.k; // Karplus-Strong
      const src=ctx.createBufferSource();src.buffer=buf;
      const g=ctx.createGain();
      const vol=I.vol*(dir==='D'?1-idx*.05:.7+idx*.05)*(dir==='D'?1:.7);
      g.gain.setValueAtTime(vol,when);g.gain.exponentialRampToValueAtTime(.001,when+I.decay);
      src.connect(g).connect(ctx.destination);src.start(when);
    });
  }
  function previewHit(v){ if(v==='N')return; ensureCtx(); strumSound(ctx.currentTime+.01,v); }

  // ---- scheduler ----
  const bpm=()=>+$('bpm').value;
  function stepDur(){return 60/bpm()/(div/4);}
  function schedule(){
    while(state.next<ctx.currentTime+0.12){
      const i=state.step, per=div/4, onBeat=i%per===0;
      if(state.counting){
        if(onBeat&&state.click)clickSound(state.next,i===0);
        const ii=i,tt=state.next;
        setTimeout(()=>{if(state.playing)highlight(-1)},Math.max(0,(tt-ctx.currentTime)*1000));
      }else{
        const v=pattern[i]||'N';
        if(onBeat&&state.click)clickSound(state.next,i===0);
        if(v!=='N'&&state.strum)strumSound(state.next,v);
        const ii=i,tt=state.next;
        setTimeout(()=>{if(state.playing)highlight(ii)},Math.max(0,(tt-ctx.currentTime)*1000));
      }
      state.next+=stepDur();
      state.step++;
      if(state.step>=div){state.step=0;if(state.counting)state.counting=false;}
    }
  }
  function start(){
    ensureCtx();
    state.playing=true;state.step=0;state.next=ctx.currentTime+0.08;
    state.counting=state.count;
    $('play').textContent='❚❚';
    state.timer=setInterval(schedule,25);
  }
  function stop(){
    state.playing=false;clearInterval(state.timer);
    $('play').textContent='▶';highlight(-1);
  }
  $('play').onclick=()=>state.playing?stop():start();
  document.addEventListener('keydown',e=>{
    if(e.code==='Space'&&!/INPUT|SELECT/.test(e.target.tagName)){e.preventDefault();$('play').click();}
  });

  // ---- controles ----
  function updateBpm(){
    const b=+$('bpm').value,o=+$('orig').value||89;
    $('bpmShown').textContent=b;
    $('pct').textContent=Math.round(b/o*100);
    save();
  }
  $('bpm').oninput=updateBpm;
  $('orig').oninput=updateBpm;
  $('minus').onclick=()=>{$('bpm').value=bpm()-1;updateBpm();};
  $('plus').onclick=()=>{$('bpm').value=bpm()+1;updateBpm();};
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    $('bpm').value=Math.max(30,Math.round((+$('orig').value||89)*b.dataset.p/100));updateBpm();
  });
  $('div').value=String(div);
  $('div').onchange=()=>{
    const nd=+$('div').value;
    const np=Array(nd).fill('N');
    // converte mantendo a posição rítmica
    pattern.forEach((v,i)=>{ if(v!=='N'){const j=Math.round(i*nd/div); if(j<nd)np[j]=v;} });
    pattern=np;div=nd;state.step=0;render();save();
  };
  const toggle=(id,key)=>$(id).onclick=function(){state[key]=!state[key];this.classList.toggle('on',state[key]);};
  toggle('tgStrum','strum');toggle('tgClick','click');toggle('tgCount','count');
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
    const p=presets[b.dataset.preset][8];
    pattern=Array(div).fill('N');
    p.forEach((v,i)=>{const j=Math.round(i*div/8);if(v!=='N')pattern[j]=v;});
    render();save();
  });
  $('name').oninput=save;
  try{const si=localStorage.getItem('toqueInst');if(si&&instruments[si])inst=si;}catch(e){}
  $('inst').value=inst;
  $('inst').onchange=()=>{inst=$('inst').value;try{localStorage.setItem('toqueInst',inst)}catch(e){}previewHit('D');};

  // ---- sequências salvas ----
  function getSaved(){try{return JSON.parse(localStorage.getItem('toqueSaved')||'[]')}catch(e){return []}}
  function putSaved(a){try{localStorage.setItem('toqueSaved',JSON.stringify(a))}catch(e){alert('Não foi possível salvar neste navegador.')}}
  function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
  function renderSaved(){
    const a=getSaved(),box=$('saved');
    if(!a.length){box.innerHTML='<div class="empty">Nenhuma sequência salva ainda.</div>';return;}
    box.innerHTML='';
    a.forEach((s,i)=>{
      const seq=s.pattern.map(v=>({D:'↓',U:'↑',N:'·'}[v])).join(' ');
      const el=document.createElement('div');el.className='item';
      el.innerHTML=`<div class="nm"><b>${esc(s.name)}</b><span>${seq} · ${s.bpm} bpm · ${s.inst==='cavaco'?'cavaquinho':'violão'}</span></div>
        <button class="btn" data-a="load">Abrir</button><button class="btn" data-a="del">Excluir</button>`;
      el.querySelector('[data-a=load]').onclick=()=>loadSeq(s);
      el.querySelector('[data-a=del]').onclick=()=>{if(confirm('Excluir "'+s.name+'"?')){const b=getSaved();b.splice(i,1);putSaved(b);renderSaved();}};
      box.appendChild(el);
    });
  }
  function loadSeq(s){
    div=s.div;pattern=s.pattern.slice();
    $('div').value=String(div);
    $('bpm').value=s.bpm;$('orig').value=s.orig;$('name').value=s.name;
    inst=instruments[s.inst]?s.inst:'violao';$('inst').value=inst;
    try{localStorage.setItem('toqueInst',inst)}catch(e){}
    state.step=0;render();updateBpm();
  }
  $('saveBtn').onclick=()=>{
    const name=$('name').value.trim()||'Sem nome';
    const item={name,div,pattern:pattern.slice(),bpm:+$('bpm').value,orig:+$('orig').value,inst};
    const a=getSaved(),i=a.findIndex(x=>x.name===name);
    if(i>=0)a[i]=item;else a.push(item);
    putSaved(a);renderSaved();
    const b=$('saveBtn');b.textContent='✓ Salvo!';setTimeout(()=>b.textContent='💾 Salvar sequência',1200);
  };
  renderSaved();

  render();updateBpm();
})();
</script>
</body>
</html>
